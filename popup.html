<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WiFi MAC Namer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">📶</div>
      <div class="title">MAC → Device</div>
    </div>

    <form class="form" id="device-form">
      <label for="mac">MAC ADDRESS</label>
      <input id="mac" placeholder="00:00:00:00:00:00" autocomplete="off" spellcheck="false" aria-describedby="error">

      <label for="name">DEVICE NAME</label>
      <input id="name" placeholder="e.g. Living Room TV" autocomplete="off" aria-describedby="error">

      <button id="add" type="submit">+ Add Device</button>
      <div id="error" class="error" role="alert"></div>
    </form>

    <div class="saved">
      <div class="saved-header">
        <span>SAVED DEVICES</span>
      </div>
      <ul id="list"></ul>
    </div>
  </div>

  <script src="mac.js"></script>
  <script src="popup.js"></script>
</body>
</html>
